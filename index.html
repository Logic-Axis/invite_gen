          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33h-.09a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="settingsPanel" class="settings-panel" style="display:none;" aria-label="設定">
          <h4>表示設定</h4>
          <div>
            <label for="autoSaveToggle">生成リンクをこのブラウザーに保存</label>
            <label class="switch" aria-label="生成リンクの自動保存">
              <input type="checkbox" id="autoSaveToggle">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="page-title">
        <div><h1>招待リンク管理</h1><p>リンクの生成とサーバー招待の整理を行います。</p></div>
      </div>

      <div class="container">
        <form id="inviteForm" class="form-card">
          <div class="card-heading">
            <span class="step-index" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M10 13.7a4 4 0 0 0 5.7 0l2-2a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10.3a4 4 0 0 0-5.7 0l-2 2A4 4 0 0 0 12 18l1.2-1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <div><h2>リンクを作成・整理</h2><p>接続情報を入力して操作を選んでください。</p></div>
          </div>

          <label for="tokens">トークン</label>
          <div style="position:relative;">
            <input type="text" id="tokens" placeholder="トークンを入力" style="padding-right:2.7rem;">
            <button id="toggleTokenMask" type="button" title="トークンの表示を切り替え" aria-label="トークンの表示を切り替え" style="position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;cursor:pointer;">
              <svg id="maskIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="19" height="19">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="#5367d8" stroke-width="2" fill="#fff"/>
                <circle cx="12" cy="12" r="3" stroke="#5367d8" stroke-width="2" fill="#5367d8"/>
                <line x1="4" y1="4" x2="20" y2="20" stroke="#ad4039" stroke-width="2"/>
              </svg>
            </button>
          </div>

          <label for="channelID">チャンネルID</label>
          <div class="field-row">
            <input type="text" id="channelID" required placeholder="招待を作成するチャンネルID">
            <button type="button" id="refreshButton" class="secondary-button small-button">チャンネル再作成</button>
          </div>

          <label for="linkCount">生成するリンク数</label>
          <input type="number" id="linkCount" value="1" min="1">

          <button type="submit" id="startButton">招待リンクを生成</button>
          <button type="button" id="stopButton" disabled>生成を停止</button>

          <section class="invite-cleaner" aria-labelledby="inviteCleanerHeading">
            <h3 id="inviteCleanerHeading">サーバー招待リンクの整理</h3>
            <label for="keepInviteCodes">残す招待コード（改行で複数可能）</label>
            <textarea id="keepInviteCodes" rows="4" aria-describedby="inviteCleanerHelp" placeholder=""></textarea>
            <button type="button" id="cleanInvitesButton" class="danger-button">指定したリンク以外を削除</button>
            <details class="full-cleanup">
              <summary>サーバーの招待をすべて削除する</summary>
              <p>安全確認として、入力欄に「全削除」と入力してください。</p>
              <div class="confirmation-field">
                <label for="deleteAllConfirmation">確認の文字</label>
                <input type="text" id="deleteAllConfirmation" autocomplete="off" spellcheck="false" placeholder="全削除">
              </div>
              <button type="button" id="deleteAllInvitesButton" class="danger-button" disabled>すべての招待リンクを削除</button>
            </details>
          </section>
        </form>

        <div class="workspace-side">
          <div class="process-log" id="processLog">
            <div class="process-log-heading">処理ログ</div>
            <ul class="process-log-list" id="processLogList"></ul>
          </div>

    <!-- 生成されたリンク一覧 -->
    <div class="log">
      <div class="log-header">
        <h3>生成されたリンク</h3>
        <button type="button" id="clearLinksBtn" class="secondary-button" title="表示中の生成リンク一覧だけを消去します。Discord上の招待は削除されません。">一覧をクリア</button>
      </div>
      <div class="log-content">
        <ul id="logList"></ul>
      </div>
      <div class="pagination-footer">
        <div class="pagination-summary" id="paginationSummary">表示 0 件</div>
        <div class="pagination-row">
          <div class="pagination">
            <button type="button" id="prevPageBtn" class="pagination-arrow" title="前のページ" aria-label="前のページ">前へ</button>
            <div id="pageButtons" class="page-buttons" role="group" aria-label="ページ番号"></div>
            <button type="button" id="nextPageBtn" class="pagination-arrow" title="次のページ" aria-label="次のページ">次へ</button>
          </div>
        </div>
      </div>
    </div>
        </div>
      </div>
    </main>
    <footer class="app-footer">Discord 招待リンク管理ツール</footer>
  </div>

  <div class="loader" id="loader" style="display:none;"></div>

  <script src="script.js"></script>
</body>
</html>
